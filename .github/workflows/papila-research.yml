name: PAPILA research run (manual, consent required)

on:
  workflow_dispatch:
    inputs:
      dataset_terms:
        description: "I reviewed Figshare PAPILA terms and approve processing its public research data on GitHub-hosted runner; type AGREE"
        required: true
        type: choice
        options:
          - "NOT AGREED"
          - "AGREE"

permissions:
  contents: read

jobs:
  research:
    if: ${{ inputs.dataset_terms == 'AGREE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Official Figshare acquisition (no redistribution)
        run: |
          hyunoptic-download --archive "$RUNNER_TEMP/PAPILA.zip" \
            --extract-to "$RUNNER_TEMP/papila" \
            --accept-dataset-terms \
            --manifest "$RUNNER_TEMP/papila.provenance.json"
      - name: Complete PAPILA inventory and internal benchmark
        run: |
          hyunoptic-reproduce --papila-root "$RUNNER_TEMP/papila" \
            --output-dir reports/v05 --verify-pixels
      - name: Bidirectional ophthalmologist role sensitivity audit
        run: |
          hyunoptic-reader-check --papila-root "$RUNNER_TEMP/papila" \
            --output-dir reports/v06
      - name: Upload aggregated research summary only
        uses: actions/upload-artifact@v4
        with:
          name: hyunoptic-v06-aggregate-report
          path: |
            reports/v05/research_summary.md
            reports/v05/run_manifest.json
            reports/v06/reader_role_summary.md
          if-no-files-found: error
          retention-days: 7
