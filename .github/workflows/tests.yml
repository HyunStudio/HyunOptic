name: Unit tests (synthetic data only)
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify frozen university experiment evidence
        run: python docs/experiments/2026-10-25-university-transfer/scripts/verify_public_evidence.py
      - name: Verify all subsequent experiment evidence
        run: python scripts/verify_experiment_evidence.py
      - name: Verify submission video and supporting payloads
        run: python -c "from pathlib import Path; from scripts.verify_experiment_evidence import verify_folder; print('Verified submission payloads:', sum(verify_folder(p.parent) for p in Path('docs/submission').glob('media*/manifest.json')))"
      - run: python -m pip install -e '.[ui,dev]'
      - run: python -m compileall -q app.py views src
      - run: hyunoptic-study --help
      - run: hyunoptic-inventory --help
      - run: hyunoptic-download --help
      - run: hyunoptic-reproduce --help
      - run: hyunoptic-reader-check --help
      - run: hyunoptic-external --help
      - run: hyunoptic-external freeze --help
      - run: hyunoptic-external test --help
      - run: hyunoptic-chaksu-audit --help
      - run: hyunoptic-verify-sources --help
      - run: hyunoptic-evidence --help
      - run: hyunoptic-source-check --help
      - run: hyunoptic-pipeline --help
      - run: hyunoptic-report --help
      - run: hyunoptic-demo-data --help
      - run: hyunoptic-seg --help
      - run: python -m hyunoptic.review.export --help
      - run: pytest -q
  ml:
    name: PyTorch segmentation (CPU, synthetic data only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[ui,dev]'
      - run: hyunoptic-seg train --help
      - run: pytest -q tests/test_seg_contract.py tests/test_seg_torch.py tests/test_seg_photometric.py tests/test_submission_demo.py tests/test_literature_seg_boundaries.py tests/test_literature_metric_consistency.py tests/test_evaluation_reader_isolation.py
